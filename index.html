<!-- Title screen particles (self-contained IIFE) -->
<script>
(function initTitleParticles(){
  const canvas=document.getElementById('titleParticles');
  if(!canvas)return;
  const ctx=canvas.getContext('2d');
  let particles=[];
  let w,h,animId;
  function resize(){
    w=canvas.width=canvas.offsetWidth;
    h=canvas.height=canvas.offsetHeight;
  }
  function createParticle(){
    const type=Math.random();
    if(type<0.6){
      return{x:Math.random()*w,y:Math.random()*h,
        vx:(Math.random()-0.5)*0.3,vy:-0.15-Math.random()*0.3,
        size:Math.random()*2+0.5,alpha:Math.random()*0.25+0.05,
        life:1,decay:0.0005+Math.random()*0.001,
        color:`rgba(197,165,90,`};
    } else if(type<0.85){
      return{x:Math.random()*w,y:h+10,
        vx:(Math.random()-0.5)*0.5,vy:-0.4-Math.random()*0.6,
        size:Math.random()*1.5+0.5,alpha:Math.random()*0.4+0.1,
        life:1,decay:0.001+Math.random()*0.002,
        color:`rgba(200,100,30,`};
    } else {
      return{x:Math.random()*w,y:Math.random()*h,
        vx:(Math.random()-0.5)*0.15,vy:(Math.random()-0.5)*0.15,
        size:Math.random()*1+0.3,alpha:Math.random()*0.15+0.03,
        life:1,decay:0.0003+Math.random()*0.0005,
        color:`rgba(245,230,200,`};
    }
  }
  function init(){
    resize();
    particles=[];
    for(let i=0;i<60;i++) particles.push(createParticle());
  }
  function draw(){
    ctx.clearRect(0,0,w,h);
    for(let i=particles.length-1;i>=0;i--){
      const p=particles[i];
      p.x+=p.vx;p.y+=p.vy;
      p.vx+=Math.sin(Date.now()*0.001+i)*0.005;
      p.life-=p.decay;
      if(p.life<=0||p.y<-20||p.x<-20||p.x>w+20){
        particles[i]=createParticle();continue;
      }
      const a=p.alpha*p.life;
      ctx.beginPath();
      ctx.arc(p.x,p.y,p.size,0,Math.PI*2);
      ctx.fillStyle=p.color+a+')';
      ctx.fill();
    }
    animId=requestAnimationFrame(draw);
  }
  window.addEventListener('resize',resize);
  init();draw();
  window._stopTitleParticles=function(){cancelAnimationFrame(animId);};
})();
</script>
